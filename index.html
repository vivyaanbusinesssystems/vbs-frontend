<!doctype html>
<html lang="en" dir="ltr">

<head>
  <!-- Marks that JavaScript is running, so scroll animations may start hidden. Without it (crawlers, scanners) all content stays visible. -->
  <script>document.documentElement.classList.add('js')</script>
  <!-- Dark mode: the saved choice, else the device setting. Runs before the page paints, so there is no white flash. -->
  <script>
    try {
      var t = localStorage.getItem('vbs-theme');
      if (t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    } catch (e) {}
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />

  <!-- 
    Primary Meta Tags (These serve as fallbacks before React Helmet loads) 
  -->
  <title>Vivyaan Business Systems — Staffing, IT & Operations Partner</title>
  <meta name="description"
    content="Enterprise-grade manpower, technology, and operations services delivered by Vivyaan Business Systems. Trusted B2B partner across industries." />
  <meta name="author" content="Vivyaan Business Systems Pvt. Ltd." />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.vivyaanbusinesssystems.com/" />
  <meta property="og:title" content="Vivyaan Business Systems — Staffing, IT & Operations Partner" />
  <meta property="og:description"
    content="Enterprise-grade manpower, technology, and operations services delivered by Vivyaan Business Systems. Trusted B2B partner across industries." />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://www.vivyaanbusinesssystems.com/" />
  <meta name="twitter:title" content="Vivyaan Business Systems — Staffing, IT & Operations Partner" />
  <meta name="twitter:description"
    content="Enterprise-grade manpower, technology, and operations services delivered by Vivyaan Business Systems. Trusted B2B partner across industries." />

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />

  <!-- Icons -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
